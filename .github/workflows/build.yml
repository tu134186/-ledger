name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压项目
        run: |
          unzip -o *.zip
          if [ -d "ledger-app" ]; then
            shopt -s dotglob
            mv ledger-app/* .
            rmdir ledger-app
          fi
          ls -la

      - name: 安装XcodeGen
        run: brew install xcodegen

      - name: 生成Xcode项目
        run: xcodegen generate

      - name: 编译
        run: |
          xcodebuild \
            -project Ledger.xcodeproj \
            -scheme Ledger \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: 打包IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ledger.app Payload/
          zip -r Ledger.ipa Payload
          ls -lh Ledger.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Ledger.ipa
          path: Ledger.ipa
