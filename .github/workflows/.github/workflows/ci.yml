 name: Build IPA 2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP_FILE"
          cd ledger-app
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Ledger.xcodeproj -scheme Ledger -configuration Release -derivedDataPath build -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ledger.app Payload/
          zip -r Ledger.ipa Payload
          cp Ledger.ipa ../

      - uses: actions/upload-artifact@v4
        with:
          name: Ledger.ipa
          path: Ledger.ipa
